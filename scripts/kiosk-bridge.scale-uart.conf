[Service]
# Sartorius BCE1202 on UART2 (GPIO0 TX / GPIO1 RX) -> /dev/ttyAMA2 on Pi OS 6.x
Environment=SCALE_MODEL=bce1202
Environment=SCALE_PORT=/dev/ttyAMA2
Environment=HX711_DISABLED=1
Environment=SCALE_UART_FALLBACK=0
Environment=SCALE_BAUD=9600
Environment=SCALE_PARITY=O
Environment=SCALE_BYTESIZE=8
Environment=SCALE_STOPBITS=1
Environment=SCALE_READ_MODE=line
